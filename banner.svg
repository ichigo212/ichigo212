    text { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
    @media (prefers-reduced-motion: reduce) { .tw, .shoot, .rise, .rise2 { animation: none; opacity: 1 } .shoot { opacity: 0 } }
  </style>
